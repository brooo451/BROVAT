    <!-- الحاوية الأساسية التي ستحتوي على العروض المضافة من قاعدة البيانات -->
    <div class="shows-container" id="showsContainer"
        style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center; margin-top: 20px;"
        dir="rtl">
        <!-- العروض ستظهر هنا أوتوماتيكياً من قاعدة البيانات -->
    </div>

    <!-- نافذة الحجز (Modal) -->
    <!-- نافذة الحجز بتصميم عريض ومثبت بالإجبار -->
    <div id="bookingModal" class="modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 99999;"
        dir="rtl">
        <div class="modal-content"
            style="background: rgba(139, 0, 0, 0.45); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.3); padding: 40px; border-radius: 24px; width: 450px !important; max-width: 90% !important; color: #fff; text-align: right; box-shadow: 0 25px 50px rgba(0,0,0,0.7); position: relative; box-sizing: border-box;">

            <!-- زر الإغلاق (X) -->
            <span onclick="document.getElementById('bookingModal').style.display = 'none'; selectedShowId = null;"
                style="cursor: pointer; position: absolute; top: 20px; left: 25px; font-size: 28px; color: #fff; font-weight: bold; transition: 0.3s;"
                onmouseover="this.style.color='#ff4757'" onmouseout="this.style.color='#fff'">&times;</span>

            <h2 style="color: #ffcc00; margin-bottom: 25px; font-size: 26px; text-align: center;">حجز تذكرة عرض 🎟️</h2>

            <label
                style="font-size: 15px; display: block; margin-bottom: 8px; opacity: 0.95; font-weight: bold;">الاسم:</label>
            <input type="text" id="userName" placeholder="ادخل اسمك الكامل" required
                style="width: 100%; padding: 14px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 12px; outline: none; box-sizing: border-box; font-size: 16px;">

            <label style="font-size: 15px; display: block; margin-bottom: 8px; opacity: 0.95; font-weight: bold;">رقم
                الهاتف:</label>
            <input type="tel" id="userPhone" placeholder="رقم هاتفك للتواصل" required
                style="width: 100%; padding: 14px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 12px; outline: none; box-sizing: border-box; font-size: 16px;">

            <label style="font-size: 15px; display: block; margin-bottom: 8px; opacity: 0.95; font-weight: bold;">عدد
                التذاكر:</label>
            <input type="number" id="ticketCount" placeholder="1" min="1" value="1"
                style="width: 100%; padding: 14px; margin-bottom: 30px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 12px; outline: none; box-sizing: border-box; font-size: 16px;">

            <button onclick="saveBooking()"
                style="background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; box-shadow: 0 6px 20px rgba(255,71,87,0.5); transition: 0.3s;">تأكيد
                الحجز 🚀</button>
        </div>
    </div>
